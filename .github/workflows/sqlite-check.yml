name: SQLite check

permissions:
  contents: read
  issues: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies (with native better-sqlite3)
        run: npm install

      - name: Type check + production build
        run: npm run build

      - name: Run SQLite verification (15 checks)
        id: verify
        shell: pwsh
        run: |
          npm run verify:sqlite 2>&1 | Tee-Object -FilePath sqlite-verify.log
          exit $LASTEXITCODE

      - name: Open issue with failure log (for agent feedback loop)
        if: failure() && steps.verify.outcome == 'failure'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $log = Get-Content sqlite-verify.log -Raw
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          $title = "SQLite verify failed (" + $sha + ")"
          $body = "SHA " + $sha + "`r`n" + $log
          gh issue create --repo "$env:GITHUB_REPOSITORY" --title "$title" --body "$body"
